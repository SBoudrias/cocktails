# Netlify project config for PR previews of the web app.
#
# Production deploys live on GitHub Pages (.github/workflows/deploy.yml).
# This Netlify site exists only to SERVE deploy previews for pull requests:
# the previews are built and uploaded by GitHub Actions
# (.github/workflows/preview.yml), which deploys the export with
# netlify-cli (`netlify deploy --alias deploy-preview-<PR>`). PR N's preview
# lives at the same URL Netlify's own previews always used,
#   https://deploy-preview-<PR>--indexotica.netlify.app/
# (the root redirects to the app) and the workflow posts the link on the
# PR. Old links and bookmarks keep working — only the builder behind the
# URL changed. Netlify's own runners are out of the loop entirely — that
# is the point: they were capped by the free build-minutes allowance,
# while GitHub Actions builds are not.
#
# The site's Git integration must have builds STOPPED (Netlify UI:
# Project configuration > Developer settings > Continuous deployment >
# Build status — or the workflow's stop-builds guard, which re-stops it
# via the API on every preview deploy). Manual CLI/API deploys still work
# with builds stopped: Netlify only serves, GitHub Actions builds.
#
# Transitional [build] for as long as the site's Git integration is still
# ACTIVE (until the NETLIFY_AUTH_TOKEN secret exists and a preview run's
# stop-builds guard has stopped them, or they are stopped in the Netlify
# UI): their runners still build this repo's PRs from this file, and with
# no [build] section those builds fail and paint the PR red. The
# placeholder keeps them green with a real publish — public/ plus a small
# landing page written at build time, so the legacy deploy-preview URL
# explains where the real preview lives instead of 404ing — never a skip:
# no ignore command, no empty deploy records, per the #605 trap below. It
# burns a few Netlify build minutes per push in the interim, then goes
# fully inert (stopped sites never build) — remove it once the guard has
# confirmed builds are stopped for good.
[build]
command = "printf '%s' '<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Preview</title><meta http-equiv=\"refresh\" content=\"10\"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem}</style></head><body><h1>Preview deploying…</h1><p>This PR preview is built and uploaded by GitHub Actions (the PR Preview workflow) and will serve at this URL once its run finishes. This page reloads every 10 seconds.</p></body></html>' > public/index.html"
publish = "public"

[build.environment]
NODE_VERSION = "24"
# The site was imported as a Next.js project, so without this Netlify's
# Next.js runtime takes over the publish and ships zero files of ours;
# this documented variable skips the runtime for static-export sites.
NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Never an ignore command here, in any form. This file used to drive
# Netlify's own builds, and a skipped build recorded an EMPTY deploy for
# its commits, which Netlify then deduplicated every later deploy of the
# same commits against ("All files already uploaded") — the mechanism
# that gave PRs #604 and #605 empty previews. With all real deploys
# arriving as uploads from GitHub Actions there is no skip path at all;
# keep it that way.
#
# What stays in this file is the serving layer's config: `netlify deploy`
# parses netlify.toml and bundles headers/redirects with every upload.
#
# The export is staged under /pr-preview/pr-<PR>/ rather than served at
# the preview root: every derived path (the noindex heuristic in
# apps/web/app/layout.tsx, the service-worker scope, the manifest, the
# smoke suite's path parsing) keys off that basePath shape, so the app
# code has no preview-specific behavior beyond reading its origin from
# NEXT_PUBLIC_SITE_ORIGIN. The staging, the diag.txt build log, and the
# root redirect are built in the workflow, next to the build it stages.

# Previews must never be indexed: the page-level robots meta (layout.tsx's
# isPreview, keyed on the /pr-preview/ basePath) covers crawlers that
# execute pages; this header covers everything else, on every response.
# Unlike Netlify's own deploy previews, alias deploys uploaded by the CLI
# do NOT get an automatic X-Robots-Tag — this header is the only layer,
# and `netlify deploy` sends it with every upload.
# It applies to every deploy of this site — and every deploy of this site
# is a preview.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
