# Netlify project config for PR previews of the web app.
#
# Production deploys live on GitHub Pages (.github/workflows/deploy.yml);
# this Netlify project exists only to build deploy previews for pull
# requests, via Netlify's own Git integration. No deploy machinery in the
# repo and no token secret: Netlify's GitHub app authenticates itself.
#
# One-time setup (Netlify UI, no repo changes): connect this repository as
# a site (the connected site is `indexotica`), keep the production branch
# as `main`, leave additional branch deploys off. Every PR then gets a
# preview at
#   https://deploy-preview-<PR>--<site>.netlify.app/
# (the root redirects to the app) and Netlify's GitHub app posts the link
# on the PR. The repo's own gate (.github/workflows/preview.yml) builds
# the same export and runs the offline + smoke checks on every PR. The
# build command resolves the site subdomain dynamically ($SITE_NAME); the
# only hardcoded copy of it is preview.yml's PREVIEW_ORIGIN, which must
# match the connected site.
#
# The export is staged under /pr-preview/pr-<PR>/ rather than served at
# the preview root: every derived path (the noindex heuristic in
# apps/web/app/layout.tsx, the service-worker scope, the manifest, the
# smoke suite's path parsing) keys off that basePath shape, so the app
# code has no preview-specific behavior beyond reading its origin from
# NEXT_PUBLIC_SITE_ORIGIN.

[build]
# The deploy-preview build (the default context). REVIEW_ID is the PR
# number at build time; SITE_NAME is the Netlify site subdomain. Both
# default safely: a build without a REVIEW_ID gets pr-0 URLs rather than
# broken ones. The diag.txt file drops the build-time git metadata into
# the deploy root, so the live preview itself shows what the build ran
# with if anything goes wrong again.
command = 'NEXT_PUBLIC_BASE_PATH=/pr-preview/pr-${REVIEW_ID:-0} NEXT_PUBLIC_SITE_ORIGIN=https://deploy-preview-${REVIEW_ID:-0}--$SITE_NAME.netlify.app yarn workspace @cocktails/web build && find apps/web/out -name "__next._full.txt" -type f -delete && rm -rf apps/web/deploy && mkdir -p apps/web/deploy/pr-preview/pr-${REVIEW_ID:-0} && mv apps/web/out/* apps/web/deploy/pr-preview/pr-${REVIEW_ID:-0}/ && mv apps/web/deploy/pr-preview/pr-${REVIEW_ID:-0}/404.html apps/web/deploy/404.html && env | grep -E "^(REVIEW_ID|CONTEXT|BRANCH|HEAD|COMMIT_REF|CACHED_COMMIT_REF|SITE_NAME|PULL_REQUEST|NETLIFY)=" > apps/web/deploy/diag.txt || true; find apps/web/deploy | wc -l >> apps/web/deploy/diag.txt && echo "<!doctype html><title>Preview</title><meta http-equiv=\"refresh\" content=\"0; url=/pr-preview/pr-${REVIEW_ID:-0}/\"><a href=\"/pr-preview/pr-${REVIEW_ID:-0}/\">Open the preview</a>" > apps/web/deploy/index.html'
publish = "apps/web/deploy"
# NO ignore command, deliberately. A skipped build records an EMPTY
# deploy for its commits, and Netlify then deduplicates every later
# deploy of the same commits against that empty record ("All files
# already uploaded") — the exact mechanism that gave PRs #604 and #605
# empty previews: the ignore command's exit-0 branches skipped builds
# (the first version gated on BRANCH, which for a deploy preview is the
# PR's base branch, i.e. main; the second on REVIEW_ID, which skipped
# the branch-deploy runs that fire on every push to a PR head branch),
# and each skip poisoned those commits. The context overrides below make
# non-preview contexts publish a real (tiny) directory instead of
# skipping, so no empty deploy records are ever created.

[build.environment]
NODE_VERSION = "24"
# The site was imported as a Next.js project, so Netlify installs its
# Next.js runtime — which provisions serverless functions for SSR and
# takes over the publish, shipping zero files for this repo (the app is
# `output: 'export'` static; there is nothing to serve through functions,
# and the deploy ends up empty with only the runtime's redirect rules).
# This documented variable skips the runtime for next-export-style sites,
# so the [build] command and publish directory are ours alone.
NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Non-preview contexts never run the app build: production stays on
# GitHub Pages (.github/workflows/deploy.yml) — this Netlify site exists
# for deploy previews only. They publish the repo's static public/ assets
# (a real, tiny directory — a couple of webp images) rather than being
# skipped, so no empty deploy records are ever created for them.
[context.production]
command = "echo 'Production deploys stay on GitHub Pages (deploy.yml); this Netlify site is deploy previews only.'"
publish = "public"

[context.branch-deploy]
command = "echo 'Branch deploys are unused; previews build on pull requests.'"
publish = "public"

# Previews must never be indexed: the page-level robots meta (layout.tsx's
# isPreview, keyed on the /pr-preview/ basePath) covers crawlers that
# execute pages; this header covers everything else, on every response —
# a second layer over netlify's automatic deploy-preview X-Robots-Tag.
# It applies to every deploy of this site — and every deploy of this site
# is a preview.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
