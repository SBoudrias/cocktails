# Netlify project config for PR previews of the web app.
#
# Production deploys live on GitHub Pages (.github/workflows/deploy.yml).
# This Netlify site exists only to SERVE deploy previews for pull requests:
# the previews are built and uploaded by GitHub Actions
# (.github/workflows/preview.yml), which deploys the export with
# netlify-cli (`netlify deploy --alias pr-<PR>`). PR N's preview lives at
#   https://pr-<PR>--indexotica.netlify.app/
# (the root redirects to the app) and the workflow posts the link on the
# PR. Netlify's own runners are out of the loop entirely — that is the
# point: they were capped by the free build-minutes allowance, while
# GitHub Actions builds are not.
#
# The site's Git integration must have builds STOPPED (Netlify UI:
# Project configuration > Developer settings > Continuous deployment >
# Build status — or the workflow's stop-builds guard, which re-stops it
# via the API on every preview deploy). Manual CLI/API deploys still work
# with builds stopped: Netlify only serves, GitHub Actions builds.
#
# No [build] section on purpose — and never an ignore command. This file
# used to drive Netlify's own builds, and a skipped build recorded an
# EMPTY deploy for its commits, which Netlify then deduplicated every
# later deploy of the same commits against ("All files already uploaded")
# — the mechanism that gave PRs #604 and #605 empty previews. With all
# deploys arriving as real uploads from GitHub Actions there is no skip
# path at all; keep it that way.
#
# What stays in this file is the serving layer's config: `netlify deploy`
# parses netlify.toml and bundles headers/redirects with every upload.
#
# The export is staged under /pr-preview/pr-<PR>/ rather than served at
# the preview root: every derived path (the noindex heuristic in
# apps/web/app/layout.tsx, the service-worker scope, the manifest, the
# smoke suite's path parsing) keys off that basePath shape, so the app
# code has no preview-specific behavior beyond reading its origin from
# NEXT_PUBLIC_SITE_ORIGIN. The staging, the diag.txt build log, and the
# root redirect are built in the workflow, next to the build it stages.

# Previews must never be indexed: the page-level robots meta (layout.tsx's
# isPreview, keyed on the /pr-preview/ basePath) covers crawlers that
# execute pages; this header covers everything else, on every response.
# Unlike Netlify's own deploy previews, alias deploys uploaded by the CLI
# do NOT get an automatic X-Robots-Tag — this header is the only layer,
# and `netlify deploy` sends it with every upload.
# It applies to every deploy of this site — and every deploy of this site
# is a preview.
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
