name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # The action fetches the PR base commit itself, but depth 1 is still not
      # enough: react-doctor diffs `base...HEAD`, and the merge-ref commit's
      # parents (the PR head + base tips) sit at depth 2. Depth 5 covers that
      # plus a few levels of rebase depth; `fetch-depth: 0` (the action's own
      # recommendation) spent ~11 min fetching this repo's full history, while
      # depth 5 adds ~1s.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - uses: millionco/react-doctor@v2.2.9
