name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # React Doctor statically diffs React components — it has nothing to
    # analyze unless the PR touches React source or the dependency graph
    # that shapes it. Measured over 10 weeks of merges to main, ~30%
    # (data backfills, CI changes, non-web dependency bumps) touched none
    # of these paths: ~20-25s of runner and queue time per wasted run. The
    # filter is evaluated against the whole PR diff, so a PR that ever
    # touched one of these paths keeps getting gated on every push.
    paths:
      # React source: routes, components, hooks, shared modules
      # (modules/stuckGlass.ts types against React) and the client
      # instrumentation entry.
      - apps/web/app/**
      - apps/web/components/**
      - apps/web/hooks/**
      - apps/web/modules/**
      - apps/web/instrumentation-client.ts
      # Dependency and build-config changes can shift what the rules see.
      - apps/web/package.json
      - apps/web/next.config.ts
      - yarn.lock
      # The workflow itself.
      - .github/workflows/react-doctor.yml
      # --- Exclusions: test files inside the filtered trees ---
      # Vitest-only modules never reach the production bundle; the CI
      # workflow lints and tests them on every PR with no path filter.
      - '!apps/web/**/*.test.ts'
      - '!apps/web/**/*.test.tsx'
      - '!apps/web/testing/**'
      - '!apps/web/vitest.setup.ts'
  push:
    branches: [main]
    # Same filter on merges: a change that never touched React source
    # cannot produce findings the PR's own run missed.
    paths:
      - apps/web/app/**
      - apps/web/components/**
      - apps/web/hooks/**
      - apps/web/modules/**
      - apps/web/instrumentation-client.ts
      - apps/web/package.json
      - apps/web/next.config.ts
      - yarn.lock
      - .github/workflows/react-doctor.yml
      - '!apps/web/**/*.test.ts'
      - '!apps/web/**/*.test.tsx'
      - '!apps/web/testing/**'
      - '!apps/web/vitest.setup.ts'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    # Slowest observed across ~25 recent runs: ~40 s. 5 min is ~7x
    # headroom while halving a stuck job's old 10-min burn.
    timeout-minutes: 5
    steps:
      # The action fetches the PR base commit itself, but depth 1 is still not
      # enough: react-doctor diffs `base...HEAD`, and the merge-ref commit's
      # parents (the PR head + base tips) sit at depth 2. Depth 5 covers that
      # plus a few levels of rebase depth; `fetch-depth: 0` (the action's own
      # recommendation) spent ~11 min fetching this repo's full history, while
      # depth 5 adds ~1s.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - uses: millionco/react-doctor@v2.2.9
        with:
          comment-on-clean: false
