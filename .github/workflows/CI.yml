name: CI

# One live run per ref: a newer push to the same branch cancels the run
# testing a commit nobody waits on. Runs on main always finish.
on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Lint ✅
        run: yarn lint

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Cache Turborepo artifacts ⚡
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          # Key on the lockfile so the exact key can match a prior run;
          # a sha-keyed cache never hits twice and every run was a miss.
          key: turbo-check-data-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            turbo-check-data-${{ runner.os }}-

      - name: JSON Schema 💽
        run: yarn check-data

      # check-data autofixes some drift (key order, $schema paths, casing).
      # In CI it must never write silently: a tree it would change fails the
      # build, so the fix is committed instead of regenerated on every run —
      # the bug that swept generated stub files into unrelated PRs (#549, #551).
      - name: No data drift 🧾
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::yarn check-data modified files — run it locally and commit the results"
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Vitest 🧪
        run: yarn test

      - uses: codecov/codecov-action@v7
