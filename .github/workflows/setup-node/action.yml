name: setup-node
description: 'Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧'
runs:
  using: 'composite'
  steps:
    - name: Setup corepack 🔧
      shell: bash
      run: corepack enable

    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'yarn'

    - name: Install dependencies 🔧
      shell: bash
      run: yarn install --immutable
