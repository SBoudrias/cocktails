name: setup-node
description: 'Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧'
runs:
  using: 'composite'
  steps:
    - name: Setup corepack 🔧
      shell: bash
      run: corepack enable

    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v5
      with:
        node-version: 24
        package-manager-cache: false

    - name: Restore node_modules cache ⚡
      id: cache-node-modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          .yarn/install-state.gz
        # Key includes every workspace manifest and .yarnrc.yml alongside
        # yarn.lock so any manifest edit triggers a cache miss and runs
        # `yarn install --immutable` (preserving lockfile-drift and hardened-mode
        # checks). No restore-keys: reconciling a stale node_modules tree is
        # slower than a clean install from the Yarn download cache.
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

    - name: Restore Yarn download cache ⚡
      id: cache-yarn
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-cache-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies 🔧
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable

    # Save immediately after install (before test/build steps write into
    # node_modules/.vite or .cache) so the cached tree stays clean and cache-hit
    # jobs skip post-job save steps entirely.
    - name: Save node_modules cache 💾
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          .yarn/install-state.gz
        key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

    - name: Save Yarn download cache 💾
      if: steps.cache-node-modules.outputs.cache-hit != 'true' && steps.cache-yarn.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.yarn/berry/cache
        key: ${{ steps.cache-yarn.outputs.cache-primary-key }}
