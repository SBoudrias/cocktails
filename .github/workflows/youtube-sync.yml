name: YouTube Sync

on:
  schedule:
    # Run every Sunday at 9 AM UTC
    - cron: '0 9 * * 0'
  workflow_dispatch:
    # Allow manual triggering for testing

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Slowest observed run: ~2.5 min (weekly data fetch). 15 min covers
    # a slow YouTube API day at ~6x headroom; the old 30 min was a stuck
    # job burning twice that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: SBoudrias/fast-setup-node@1e8dc0801940897dfc89fae43b755dbe0c57a64e # v1
        with:
          # The sync step invokes yarn youtube-sync after setup; without this
          # a corepack-less exact cache hit leaves the runner on global yarn 1.
          enable-package-manager: 'true'

      - name: Install yt-dlp 📦
        run: pip install yt-dlp

      - name: Run YouTube sync 📺
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: yarn youtube-sync
