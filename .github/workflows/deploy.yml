name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    # The deploy builds the site export and gates it — a merge that
    # cannot change the built export (test-only refactors, CI workflow
    # changes, youtube-sync tooling) produces a byte-identical site and
    # re-verifies a build nobody changed. Same paths + negations pattern
    # as preview.yml (proven byte-identical exports in #544); the gates'
    # own scripts stay INCLUDED here (unlike preview.yml, which only runs
    # verify-offline.ts) because this workflow IS what runs them in
    # production: a change to verify-offline.ts or the smoke suite should
    # exercise itself against a real deploy.
    paths:
      - apps/web/**
      - packages/data/**
      - packages/conversion/**
      - packages/ingredient-sorting/**
      - packages/smoke/**
      - public/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - tsconfig.json
      - .github/workflows/deploy.yml
      # --- Exclusions: files that cannot affect the built export ---
      # Same proven set as preview.yml (each was diffed against a clean
      # baseline in #544: test files, editor/config files, agent docs,
      # check-data tooling and per-package tsconfigs never reach the
      # export). generate-icons.ts writes committed PNGs by hand; its
      # output (apps/web/public/icons/*) is served, so it stays matched
      # by apps/web/** above.
      - '!apps/web/**/*.test.ts'
      - '!apps/web/**/*.test.tsx'
      - '!apps/web/testing/**'
      - '!apps/web/vitest.setup.ts'
      - '!packages/**/*.test.ts'
      - '!apps/web/tools/generate-icons.ts'
      - '!apps/web/types/**'
      - '!apps/web/components.json'
      - '!apps/web/AGENTS.md'
      - '!apps/web/CLAUDE.md'
      - '!packages/data/globs.stub.ts'
      - '!packages/data/schemas/**'
      - '!packages/data/approved-overlaps.json'
      - '!packages/data/tsconfig.json'
      - '!packages/conversion/tsconfig.json'
      - '!packages/ingredient-sorting/tsconfig.json'
  workflow_dispatch:

# The official Pages deploy: the site builds into an artifact that
# deploy-pages publishes atomically. No gh-pages branch — the artifact is
# the deploy, so the 57 GB branch history is gone (hosting-migration's
# decision: keep Pages, switch to the artifact deploy, kill the branch).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  # A newer push to main always wins: cancelling a superseded deploy
  # mid-build is safe (Pages keeps serving the last deployed artifact
  # until the newer run's own atomic deploy lands) and saves its ~3 min
  # of runner time — main pushes land in bursts after PR-merge sprees.
  # Cancellation never kills a deploy-pages step that already started
  # publishing an artifact: the newer run redeploys over it regardless.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: SBoudrias/fast-setup-node@1e8dc0801940897dfc89fae43b755dbe0c57a64e # v1

      - name: Build with Next.js 🏗️
        run: yarn workspace @cocktails/web build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Prune the __next._full.txt payloads: static export emits each route
      # as a .html plus several .txt RSC payload variants. Browser-session
      # instrumentation shows the client router only ever requests
      # __next._tree.txt, *__PAGE__.txt (prefetch) and plain route.txt
      # (?_rsc navigation) — the _full route-tree payload is never fetched,
      # so it is dead weight (~81 MB / 4,767 files on a full export). The
      # requested variants stay: deleting them would break soft navigation
      # (every click would fall back to a full page load and 404 the
      # router's prefetches).
      - name: Prune payload twins 🧹
        run: find apps/web/out -name '__next._full.txt' -type f -delete

      # The offline gate: same check as the PR preview — the production
      # deploy's PWA must keep its offline story (precache contents, offline
      # browsing, fallbacks, redeploy survival) or the deploy fails.
      - name: Verify offline PWA 📴
        timeout-minutes: 10
        run: node apps/web/tools/verify-offline.ts

      - name: Upload Pages artifact 📦
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/out

      - name: Deploy to GitHub Pages 🚀
        id: deploy
        uses: actions/deploy-pages@v5

      # Waits for GitHub Pages to serve this build, then fetches the home
      # page and a page of each type and fails on any non-200 or missing
      # marker (packages/smoke).
      - name: Smoke test production 🔥
        timeout-minutes: 14
        run: yarn workspace @cocktails/smoke smoke "https://${{ github.repository_owner }}.github.io/cocktails/" "$GITHUB_WORKSPACE/apps/web/out"
        env:
          SMOKE_LIVE_TIMEOUT_S: '720'
