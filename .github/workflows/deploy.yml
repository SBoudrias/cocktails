name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Build with Next.js 🏗️
        run: yarn workspace @cocktails/web build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Prune the .txt payload twins: static export duplicates every route's
      # RSC payload as .html, .rsc and .txt. The .txt files are pure
      # duplicates (~55% of the output size). Trade-off: client-side
      # navigation to these routes falls back to a full page load via the
      # .html/.rsc payloads — no functional loss, just slower soft-navs.
      - name: Prune payload twins 🧹
        run: find apps/web/out -name '*.txt' -type f -delete

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./apps/web/out
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
