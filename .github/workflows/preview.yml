name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    # Only build a preview when the site itself can change: the web app, the
    # workspace packages it imports (data, conversion, ingredient-sorting),
    # static assets, dependency manifests, and this workflow. The filter is
    # evaluated against the whole PR diff, so a PR that ever touched these
    # keeps getting previews and its `closed` run still removes the directory.
    # A PR that never matched has no preview dir to remove; the hourly
    # cleanup-previews.yml also sweeps any leftover for closed PRs.
    paths:
      - apps/web/**
      - packages/data/**
      - packages/conversion/**
      - packages/ingredient-sorting/**
      - public/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - tsconfig.json
      - .github/workflows/preview.yml
      - .github/workflows/setup-node/**

permissions:
  contents: write
  pull-requests: write

# Never cancel a running preview job: it may be mid-push to gh-pages. A
# cancelled job's push can still land after the next run fetched the branch,
# and when that next run is the PR-closed removal, the rebase conflicts
# (modify/delete in pr-preview/pr-N) and the job fails (PR #540's merge run).
# Queued runs still collapse to the newest one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node
        if: github.event.action != 'closed'

      - name: Build with preview basePath 🏗️
        if: github.event.action != 'closed'
        run: yarn workspace @cocktails/web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_PATH: /cocktails/pr-preview/pr-${{ github.event.number }}

      # Prune the __next._full.txt payloads: static export emits each route
      # as a .html plus several .txt RSC payload variants. Browser-session
      # instrumentation shows the client router only ever requests
      # __next._tree.txt, *__PAGE__.txt (prefetch) and plain route.txt
      # (?_rsc navigation) — the _full route-tree payload is never fetched,
      # so it is dead weight (~81 MB / 4,767 files on a full export). The
      # requested variants stay: deleting them would break soft navigation
      # (every click would fall back to a full page load and 404 the
      # router's prefetches).
      - name: Prune payload twins 🧹
        if: github.event.action != 'closed'
        run: find apps/web/out -name '__next._full.txt' -type f -delete

      # The offline gate: drives headless Chrome (installed on the runner)
      # against the built export and fails the preview if the PWA's offline
      # story breaks — precache contents, offline browsing, fallbacks, and
      # survival of a simulated redeploy (apps/web/tools/verify-offline.ts).
      - name: Verify offline PWA 📴
        if: github.event.action != 'closed'
        timeout-minutes: 10
        run: node apps/web/tools/verify-offline.ts
        env:
          NEXT_PUBLIC_BASE_PATH: /cocktails/pr-preview/pr-${{ github.event.number }}

      - name: Deploy PR Preview 🚀
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./apps/web/out/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      # Waits for GitHub Pages to serve this build, then fetches the home
      # page and a page of each type and fails on any non-200 or missing
      # marker (packages/smoke).
      - name: Smoke test the preview 🔥
        if: github.event.action != 'closed'
        timeout-minutes: 14
        run: yarn workspace @cocktails/smoke smoke "${{ steps.preview.outputs.preview-url }}" "$GITHUB_WORKSPACE/apps/web/out"
        env:
          SMOKE_LIVE_TIMEOUT_S: '720'
