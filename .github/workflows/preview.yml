name: PR Preview

# The repo-side preview pipeline: build the site export on GitHub Actions,
# run the offline and smoke gates against it, then upload it to the Netlify
# site as a PR-scoped alias deploy. Netlify's own runners are out of the
# loop — the site's Git integration has builds stopped, so no Netlify
# build minutes are spent: Netlify only serves what this workflow uploads.
# PR N's preview lives at the same URL Netlify's own previews always used,
#   https://deploy-preview-N--indexotica.netlify.app/
# (the root redirects to the app under /pr-preview/pr-N/) and the
# preview-link step posts it on the PR. Old links and bookmarks keep
# working — only the builder behind the URL changed.
#
# Auth: the NETLIFY_AUTH_TOKEN repo secret (a Netlify personal access
# token, app.netlify.com > user settings > applications), created once by
# hand. Runs without it (missing secret, fork PRs) still run the gates
# but skip the deploy. A guard step re-asserts via the API that the
# site's builds are stopped before every upload: relinking the site's
# repository silently reactivates its builds, and the guard re-stops
# them — keeping Netlify out of the build business for good. (Manual
# CLI/API deploys are unaffected by stopped builds; that is exactly the
# setup we want.)
#
# The upload is netlify-cli's `deploy --alias deploy-preview-N` — an
# alias deploy, never published to the site's main URL, and every push
# to the PR replaces the previous one at the same URL. The alias reuses
# the classic deploy-preview-N subdomain, so the URL Netlify's GitHub
# app has always posted stays valid — only the builder behind it
# changed. There is deliberately no
# skip path anywhere (see netlify.toml for the #605 empty-deploy trap
# this avoids): every deploy is a real upload of the export this run
# built. The CLI reads the repo's netlify.toml and bundles its
# [[headers]] with every upload, so the X-Robots-Tag keeps applying to
# the previews Netlify serves.
#
# What the gates check: the offline PWA verification (headless Chrome
# against the export) and the smoke suite (a page of each type fetched
# and marker-checked). They run against a local `serve` of the staged
# export with cleanUrls, which mirrors the Netlify runtime (pretty URLs
# on by default): /recipes/x resolves recipes/x.html, exactly like
# production Pages does. When the PR closes, the cleanup job deletes
# its alias deploys via the API (alias deploys, unlike Netlify's own
# deploy previews, are not removed on close by themselves).
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    # Only gate when the site itself can change: the web app, the workspace
    # packages it imports (data, conversion, ingredient-sorting), static
    # assets, dependency manifests, and this workflow. The filter is
    # evaluated against the whole PR diff, so a PR that ever touched these
    # keeps getting preview gates on every push.
    #
    # The negations below carve out everything that cannot reach the built
    # export (`yarn workspace @cocktails/web build` output). Every entry was
    # proven the same way: with all of them poisoned at once (test files
    # given a valid new export, configs deleted or corrupted) and the build
    # parallelism pinned, the export is byte-identical to the clean
    # baseline modulo per-build randomness (build ID, SW version, sitemap
    # lastmod) — 28,885 files, 0 differing. What the preview's own build
    # and gates still consume stays INCLUDED: the web app; the build-
    # invoked tools (generate-sw-precache.ts, verify-internal-links.ts run
    # inside the build script — see tools below for the ones that do not);
    # packages/data's data JSON, globs.ts and src/** (imported at build
    # time); packages/conversion + ingredient-sorting src; root public/
    # (imported by app/layout.tsx); package.json/yarn.lock (yarn install);
    # tsconfig.json (next build's typecheck); netlify.toml (bundled with
    # the upload); this workflow and setup-node (the pipeline itself).
    paths:
      - apps/web/**
      - packages/data/**
      - packages/conversion/**
      - packages/ingredient-sorting/**
      - public/**
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - tsconfig.json
      - netlify.toml
      - .github/workflows/preview.yml
      - .github/workflows/setup-node/**
      # --- Exclusions: files that cannot affect the built export ---
      #
      # Test files and test utilities, everywhere in the filtered subtrees.
      # Vitest reads them; `next build` never bundles a module that only a
      # *.test.ts imports. The repo's CI workflow runs lint (which
      # typechecks the test files) and vitest on every PR with no path
      # filter, so test-only PRs stay gated there.
      - '!apps/web/**/*.test.ts'
      - '!apps/web/**/*.test.tsx'
      - '!apps/web/testing/**'
      - '!apps/web/vitest.setup.ts'
      - '!packages/**/*.test.ts'
      # apps/web/tools: only generate-sw-precache.ts and
      # verify-internal-links.ts run inside `yarn workspace @cocktails/web
      # build` — they stay matched by apps/web/** above. The rest never runs
      # in the build: generate-icons.ts writes the committed PNGs by hand
      # (its output, apps/web/public/icons/*, IS served),
      # css-module-sync.test.ts is a vitest-only contract test (covered by
      # the *.test.ts negation above), and verify-offline.ts is the preview
      # gate itself (the workflow runs it against the build; the build does
      # not run it).
      - '!apps/web/tools/generate-icons.ts'
      - '!apps/web/tools/verify-offline.ts'
      # Type-only and editor/config files: never emitted (Turbopack strips
      # types), and components.json is the shadcn CLI's config — nothing
      # imports it.
      - '!apps/web/types/**'
      - '!apps/web/components.json'
      # Agent docs.
      - '!apps/web/AGENTS.md'
      - '!apps/web/CLAUDE.md'
      # packages/data: the app imports data JSON (through packages/data's
      # import.meta.glob), globs.ts (the loader map) and src/** — all
      # matched by packages/data/** above. Everything else is tooling:
      # globs.stub.ts is a vitest-only alias (vitest.config.mts), the
      # schemas and the approved-overlaps registry are read only by
      # `yarn check-data` (CI's schema job), and tsconfig.json only
      # configures that package's `tsc --noEmit` lint.
      - '!packages/data/globs.stub.ts'
      - '!packages/data/schemas/**'
      - '!packages/data/approved-overlaps.json'
      - '!packages/data/tsconfig.json'
      # Each package's tsconfig only configures its `tsc --noEmit` lint.
      - '!packages/conversion/tsconfig.json'
      - '!packages/ingredient-sorting/tsconfig.json'

permissions:
  # The preview-link step comments on the PR with the workflow's token.
  pull-requests: write
  contents: read

# A newer push to the same PR cancels a run testing a commit nobody waits
# on — including one mid-upload; the next push's deploy replaces the alias.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Same basePath the staging step builds the export under. Same shape as
  # the old gh-pages previews (/pr-preview/pr-N), without the /cocktails
  # repo segment — the preview site is a dedicated Netlify project rooted
  # at /.
  PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}
  # The alias URL netlify-cli's `deploy --alias deploy-preview-N` serves:
  # the same URL Netlify's own previews always used — old links and
  # bookmarks keep working, only the builder behind the URL changed.
  PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.number }}--indexotica.netlify.app
  # A Netlify personal access token (app.netlify.com > user settings >
  # applications), created once by hand as a repo secret. Missing (not
  # created yet, or a fork PR): the gates still run, the deploy is
  # skipped with a warning.
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  preview-gate:
    # `closed` runs skip this build job entirely — the cleanup job handles
    # them. The build is ~10 minutes of runner time; no one looks at a
    # preview of a PR that just closed.
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Build with preview basePath 🏗️
        run: yarn workspace @cocktails/web build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.PREVIEW_BASE_PATH }}
          # Canonical/OG URLs derive from the actual preview host, not the
          # production Pages origin (layout.tsx).
          NEXT_PUBLIC_SITE_ORIGIN: ${{ env.PREVIEW_ORIGIN }}

      # Prune the __next._full.txt payloads: static export emits each route
      # as a .html plus several .txt RSC payload variants. Browser-session
      # instrumentation shows the client router only ever requests
      # __next._tree.txt, *__PAGE__.txt (prefetch) and plain route.txt
      # (?_rsc navigation) — the _full route-tree payload is never fetched,
      # so it is dead weight (~81 MB / 4,767 files on a full export). The
      # requested variants stay: deleting them would break soft navigation
      # (every click would fall back to a full page load and 404 the
      # router's prefetches).
      - name: Prune payload twins 🧹
        run: find apps/web/out -name '__next._full.txt' -type f -delete

      # The offline gate: drives headless Chrome (installed on the runner)
      # against the built export and fails the preview if the PWA's offline
      # story breaks — precache contents, offline browsing, fallbacks, and
      # survival of a simulated redeploy (apps/web/tools/verify-offline.ts).
      - name: Verify offline PWA 📴
        timeout-minutes: 10
        run: node apps/web/tools/verify-offline.ts
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.PREVIEW_BASE_PATH }}

      # Stage the export under its basePath: the preview URL root serves
      # the staged tree, so the built URLs (sw.js scope, manifest,
      # canonicals) resolve as-is. The serve config turns on cleanUrls so
      # /recipes/x finds recipes/x.html — Netlify's pretty URLs do the
      # same in production previews, and Pages has always served the app
      # this way. The serve.json is for the local smoke server below only;
      # the deploy tree step removes it before the upload.
      - name: Stage export under its basePath 🗂️
        run: |
          mkdir -p "apps/web/deploy${PREVIEW_BASE_PATH}"
          mv apps/web/out/* "apps/web/deploy${PREVIEW_BASE_PATH}/"
          echo '{"cleanUrls": true}' > apps/web/deploy/serve.json

      # The smoke gate: serve the staged export locally and fetch the home
      # page and a page of each type, failing on any non-200 or missing
      # marker (packages/smoke) — the same suite that runs against the
      # production deploy. serve (Vercel) is the cleanUrls reference
      # implementation; Netlify's pretty URLs match its semantics.
      - name: Smoke test the preview 🔥
        timeout-minutes: 5
        run: |
          npx --yes serve@14 --no-clipboard --listen 4170 apps/web/deploy > serve.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:4170" && break
            sleep 1
          done
          yarn workspace @cocktails/smoke smoke \
            "http://localhost:4170${PREVIEW_BASE_PATH}/" \
            "$GITHUB_WORKSPACE/apps/web/deploy${PREVIEW_BASE_PATH}" \
            || { kill $SERVER_PID; cat serve.log; exit 1; }
          kill $SERVER_PID

      # The gates passed: turn the staged tree into the deploy the site
      # serves. diag.txt drops this run's build metadata into the deploy
      # root (what the live preview ran with, if anything goes wrong
      # again), _headers tells Netlify to send X-Robots-Tag: noindex on
      # every response (alias deploys do not get an automatic noindex
      # header), the meta-refresh index lands the preview root on the app,
      # and the 404 lands at the alias root so the export's own error
      # page handles unknown paths there too. The serve.json was for the
      # local smoke server only; the upload must not carry it.
      - name: Finish the deploy tree 🌳
        run: |
          rm apps/web/deploy/serve.json
          mv "apps/web/deploy${PREVIEW_BASE_PATH}/404.html" apps/web/deploy/404.html
          {
            echo "GITHUB_RUN: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "COMMIT_REF: $GITHUB_SHA"
            echo "PR: ${{ github.event.pull_request.html_url }}"
            echo "PREVIEW_ALIAS_URL: $PREVIEW_ORIGIN"
            find apps/web/deploy | wc -l
          } > apps/web/deploy/diag.txt
          cat > apps/web/deploy/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow
          EOF
          cat > apps/web/deploy/index.html <<EOF
          <!doctype html><title>Preview</title><meta http-equiv="refresh" content="0; url=${PREVIEW_BASE_PATH}/"><a href="${PREVIEW_BASE_PATH}/">Open the preview</a>
          EOF

      # Belt and suspenders: the site's Git integration must stay with
      # builds stopped, or every push re-spends Netlify build minutes —
      # and relinking the site's repository silently reactivates them.
      # The API field the UI's "Build status" toggle writes is
      # repo.stop_builds; PATCH it back on when it has drifted true.
      # Stopped builds never block the manual deploy below.
      # Raw API paths need the site's ID (the name-in-path form is a
      # CLI convenience): resolve it once here from the documented
      # ?name= filter and export it for every later API step.
      - name: Ensure Netlify builds are stopped 🛑
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          set -eu
          site_id="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?name=indexotica" \
            | jq -r '[.[] | select(.name == "indexotica")] | .[0].id // empty')"
          if [ -z "$site_id" ]; then
            echo "::error::could not resolve the indexotica site's Netlify ID"
            exit 1
          fi
          echo "SITE_ID=$site_id" >> "$GITHUB_ENV"
          site="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$site_id")"
          repo="$(printf '%s' "$site" | jq -c '.repo // empty')"
          if [ -z "$repo" ]; then
            echo "site has no linked repository — nothing to guard"
          elif [ "$(printf '%s' "$repo" | jq -r '.stop_builds // false')" != "true" ]; then
            echo "::warning::indexotica's Netlify builds were active — re-stopping them (a reactivated git integration would spend Netlify build minutes on every push)"
            # PATCH with the full repo object, stop_builds flipped: sending
            # only the one field could clobber the link's other settings.
            body="$(printf '%s' "$repo" | jq -c '{repo: (.stop_builds = true)}')"
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "https://api.netlify.com/api/v1/sites/$site_id" > /dev/null
          fi

      # The deploy: an alias upload of the staged export, PR-scoped and
      # never published — `netlify deploy --alias deploy-preview-N`
      # replaces the previous deploy at the same URL on every push. The
      # alias reuses the classic deploy-preview-N subdomain, so the URL
      # Netlify's own previews always served keeps working. --no-build:
      # the export is already built and staged above; the CLI only
      # uploads. --filter picks the web workspace package: the repo is a
      # monorepo, and the CLI refuses to choose a project by itself in
      # CI (the --dir path stays repo-root relative, and the root
      # netlify.toml — the [[headers]] the CLI bundles with the upload —
      # is still found). Skipped without a token (secret missing, fork
      # PR): the gates already ran.
      # First, free the subdomain: any deploy-preview object Netlify's
      # git integration built for this PR still claims the URL — this
      # run's guard stopped those builds, and deleting the stale object
      # lets the alias take over the subdomain.
      # Free the classic subdomain: a deploy-preview object Netlify's git
      # integration built for this PR may still claim
      # deploy-preview-N--indexotica.netlify.app (the guard just stopped
      # future ones; this deletes the stale object). Deleting is safe —
      # the alias deploy below immediately claims the subdomain.
      - name: Free the legacy deploy-preview subdomain 🧹
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          set -eu
          pr="${{ github.event.pull_request.number }}"
          page=1
          while :; do
            deploys="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=100&page=$page")"
            count="$(printf '%s' "$deploys" | jq 'length')"
            [ "$count" -eq 0 ] && break
            printf '%s' "$deploys" | jq -r --argjson pr "$pr" \
              '.[] | select(.review_id == $pr and .branch != "deploy-preview-\($pr|tostring)") | .id' \
              | while read -r id; do
              [ -n "$id" ] || continue
              echo "deleting stale git-integration deploy $id"
              curl -fsS -X DELETE -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                "https://api.netlify.com/api/v1/deploys/$id" || true
            done
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

      - name: Deploy preview to Netlify 🚀
        id: netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        timeout-minutes: 15
        run: |
          set -eu
          node apps/web/tools/deploy-netlify.ts \
            --dir apps/web/deploy \
            --site-id "$SITE_ID" \
            --alias "deploy-preview-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            > deploy.json
          url="$(jq -r '.deploy_url // empty' deploy.json)"
          if [ -z "$url" ] || [ "$url" != "$PREVIEW_ORIGIN" ]; then
            cat deploy.json
            echo "expected deploy URL $PREVIEW_ORIGIN, got '${url:-none}'"
            exit 1
          fi
          echo "deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Verify what Netlify actually serves: the full smoke suite against
      # the live alias URL — with the local build as the freshness
      # reference, it waits until the URL serves this run's hashed assets
      # (the CDN can lag the upload by a bit) and then checks every page
      # type — plus the serving-layer specifics it cannot see: the
      # noindex header, the root redirect, and diag.txt.
      - name: Verify the live preview 🛰️
        if: ${{ steps.netlify.outputs.url != '' }}
        timeout-minutes: 10
        env:
          SMOKE_LIVE_TIMEOUT_S: '300'
        run: |
          set -eu
          # Wait for the upload to go live (the smoke suite below waits for
          # this run's hashed assets, but the header checks run first).
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$PREVIEW_ORIGIN${PREVIEW_BASE_PATH}/" && break
            sleep 5
          done
          # The app page, with the noindex header netlify.toml sends.
          headers="$(curl -fsSI "$PREVIEW_ORIGIN${PREVIEW_BASE_PATH}/")"
          printf '%s' "$headers" | grep -qi 'x-robots-tag:.*noindex' \
            || { echo "no X-Robots-Tag on the live preview"; exit 1; }
          # The deploy root: meta-refresh into the app.
          root="$(curl -fsS "$PREVIEW_ORIGIN/")"
          printf '%s' "$root" | grep -q "${PREVIEW_BASE_PATH}/" \
            || { echo "preview root does not redirect to the app"; exit 1; }
          # The build's own record of itself.
          curl -fsS "$PREVIEW_ORIGIN/diag.txt" | grep -q "$GITHUB_SHA" \
            || { echo "diag.txt missing or stale on the live preview"; exit 1; }
          # Every page type, against the live deploy.
          yarn workspace @cocktails/smoke smoke \
            "$PREVIEW_ORIGIN${PREVIEW_BASE_PATH}/" \
            "$GITHUB_WORKSPACE/apps/web/deploy${PREVIEW_BASE_PATH}"
          echo "live preview verified: $PREVIEW_ORIGIN"

      # Post the preview link on the PR, in the repo's convention
      # ('netlify preview: <link>'). One comment per PR, edited in place
      # on later pushes so the link never goes stale: this finds this
      # workflow's own comment (by author + marker) rather than whatever
      # comment happens to be last on the thread.
      - name: Post preview link on the PR 🔗
        if: ${{ steps.netlify.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          body="netlify preview: ${{ steps.netlify.outputs.url }}"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq 'map(select(.user.login == "github-actions[bot]" and (.body | startswith("netlify preview:")))) | last | .id // empty')"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" > /dev/null
          fi

  # When the PR closes, its alias deploys are deleted: unlike Netlify's
  # own deploy previews, alias deploys would otherwise sit on the site
  # forever. No checkout or build — list the site's deploys via the API
  # and delete the ones whose branch is this PR's alias (netlify-cli
  # records `--alias deploy-preview-N` as branch deploy-preview-N).
  # Best-effort: a failed deletion must not paint a merged PR red.
  cleanup:
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the PR's alias deploys 🧹
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          set -u
          site_id="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?name=indexotica" \
            | jq -r '[.[] | select(.name == "indexotica")] | .[0].id // empty')"
          if [ -z "$site_id" ]; then
            echo "could not resolve the indexotica site's Netlify ID — nothing to clean up"
            exit 0
          fi
          alias="deploy-preview-${{ github.event.pull_request.number }}"
          page=1
          while :; do
            deploys="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$site_id/deploys?per_page=100&page=$page")"
            count="$(printf '%s' "$deploys" | jq 'length')"
            [ "$count" -eq 0 ] && break
            printf '%s' "$deploys" | jq -r --arg alias "$alias" \
              '.[] | select(.branch == $alias) | .id' | while read -r id; do
              [ -n "$id" ] || continue
              echo "deleting deploy $id ($alias)"
              curl -fsS -X DELETE -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                "https://api.netlify.com/api/v1/deploys/$id" || true
            done
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
