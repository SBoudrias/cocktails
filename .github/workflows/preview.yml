name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node
        if: github.event.action != 'closed'

      - name: Build with preview basePath 🏗️
        if: github.event.action != 'closed'
        run: yarn workspace @cocktails/web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_PATH: /cocktails/pr-preview/pr-${{ github.event.number }}

      # Prune the .txt payload twins: static export emits each route as a
      # .html file plus duplicate .txt payload files (~55% of the output
      # size, measured). Trade-off: client-side navigation to these routes
      # falls back to a full page load via the .html files — no functional
      # loss, just slower soft-navs.
      - name: Prune payload twins 🧹
        if: github.event.action != 'closed'
        run: find apps/web/out -name '*.txt' -type f -delete

      - name: Deploy PR Preview 🚀
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./apps/web/out/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
