version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v2.2.1+ uses actions/cache@v4, which still targets Node.js 20.
      - dependency-name: millionco/react-doctor

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nextjs:
        patterns:
          - next
          - '@next/*'
          - next-*
          - '@vitejs/*'
          - nuqs
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      styling:
        patterns:
          - '@mui/*'
          - '@emotion/*'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - happy-dom
      typescript:
        patterns:
          - typescript
          - '@types/node'
          - '@types/lodash'
      linting:
        patterns:
          - oxlint
          - oxfmt
          - husky
          - nano-staged
      task-runner:
        patterns:
          - turbo
      ajv:
        patterns:
          - ajv
          - ajv-cli
